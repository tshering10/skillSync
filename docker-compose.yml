services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: skillsync_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsync}
      POSTGRES_USER: ${POSTGRES_USER:-skillsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsync_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: skillsync_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: skillsync_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-change-in-prod}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-skillsync}:${POSTGRES_PASSWORD:-skillsync_secret}@db:5432/${POSTGRES_DB:-skillsync}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
